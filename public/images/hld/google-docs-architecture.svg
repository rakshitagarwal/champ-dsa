<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Google Docs — sticky doc servers, OT/CRDT ops, presence">
  <rect width="1000" height="360" fill="#0f172a"/>
  <defs>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(230,237,247,0.06)" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fa1bd"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="url(#g)"/>
  <text x="16" y="24" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">Google Docs — sticky doc servers, OT/CRDT ops, presence</text>
  <rect x="555" y="95" width="180" height="95" rx="10" fill="none" stroke="rgba(230,237,247,0.28)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="565" y="109" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">Fleet · sticky docId</text>
  <rect x="16" y="140" width="100" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="66" y="160" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Browser</text><text x="66" y="180" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">HTTPS + WS</text>
  <rect x="140" y="140" width="90" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="185" y="160" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">CDN/Edge</text><text x="185" y="180" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">static assets</text>
  <rect x="255" y="140" width="110" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="310" y="160" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">API Gateway</text><text x="310" y="180" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">auth + ACL</text>
  <rect x="255" y="50" width="130" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="320" y="70" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Metadata svc</text><text x="320" y="90" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">Postgres docs/acl</text>
  <rect x="255" y="250" width="130" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="320" y="270" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">S3 snapshots</text><text x="320" y="290" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">docs/{id}/rev{n}</text>
  <rect x="420" y="140" width="120" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="480" y="160" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Doc Router</text><text x="480" y="180" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">docId→host Redis</text>
  <rect x="570" y="120" width="150" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="645" y="140" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Doc Server</text><text x="645" y="160" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">in-mem + seq + fanout</text>
  <rect x="750" y="50" width="130" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="815" y="70" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Kafka oplog</text><text x="815" y="90" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">partition docId</text>
  <rect x="750" y="140" width="130" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="815" y="160" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Presence</text><text x="815" y="180" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">Redis TTL 30s</text>
  <rect x="750" y="250" width="130" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="815" y="270" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Comments</text><text x="815" y="290" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">OT anchors</text>
  <path d="M116 166L140 166" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M230 166L255 166" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M365 166L255 76" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M365 166L255 276" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M365 166L420 166" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M540 166L570 146" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M720 146L750 76" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M720 146L750 166" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M720 146L750 276" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <text x="16" y="346" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">One primary per docId serializes ops; Kafka/oplog durable; Redis presence TTL; S3 snapshots for joiners.</text>
</svg>
