<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-label="Request path: Client to DNS to CDN to load balancer to app servers, then cache, database, and queue">
  <rect width="900" height="190" fill="#0f172a"/>
  <defs>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(230,237,247,0.06)" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fa1bd"/>
    </marker>
  </defs>
  <rect width="900" height="190" fill="url(#g)"/>
  <rect x="10" y="70" width="90" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="55" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Client</text>
  <rect x="140" y="70" width="80" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="180" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">DNS</text>
  <rect x="260" y="70" width="80" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="300" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">CDN</text>
  <rect x="380" y="70" width="110" height="44" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/>
  <text x="435" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Load balancer</text>
  <rect x="540" y="70" width="110" height="44" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/>
  <text x="595" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">App servers</text>
  <rect x="720" y="10" width="110" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="775" y="37" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Cache</text>
  <rect x="720" y="70" width="110" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="775" y="97" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Database</text>
  <rect x="720" y="130" width="110" height="44" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/>
  <text x="775" y="157" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Queue / Kafka</text>
  <path d="M100 92H138" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M220 92H258" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M340 92H378" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M490 92H538" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M650 82L718 36" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M650 92H718" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M650 102L718 152" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <text x="10" y="180" fill="#8fa1bd" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">Almost every design question is a variation of this path. Know what each box does and how it fails.</text>
</svg>
