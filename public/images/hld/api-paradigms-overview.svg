  <path d="M360 196L450 196" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M610 56L700 126" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M610 126L700 126" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M610 196L700 126" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <text x="16" y="246" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Public REST (cacheable), mobile GraphQL BFF (one call), internal gRPC (binary + streams).</text>
</svg>
