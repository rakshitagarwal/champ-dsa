<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-label="API paradigms — pick by surface, not fashion">
  <rect width="920" height="260" fill="#0f172a"/>
  <defs>
    <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(230,237,247,0.06)" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fa1bd"/>
    </marker>
  </defs>
  <rect width="920" height="260" fill="url(#g)"/>
  <text x="16" y="24" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">API paradigms — pick by surface, not fashion</text>
  
  <rect x="16" y="100" width="90" height="40" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="61" y="124" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Client</text>
  <rect x="200" y="30" width="160" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="280" y="50" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">REST</text><text x="280" y="70" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">resource + CDN</text>
  <rect x="200" y="100" width="160" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="280" y="120" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">GraphQL</text><text x="280" y="140" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">BFF / mobile</text>
  <rect x="200" y="170" width="160" height="52" rx="8" fill="#10332f" stroke="#38d0b8" stroke-width="1.6"/><text x="280" y="190" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">gRPC</text><text x="280" y="210" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">HTTP/2 stream</text>
  <rect x="450" y="30" width="160" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="530" y="50" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Public API</text><text x="530" y="70" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">partners</text>
  <rect x="450" y="100" width="160" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="530" y="120" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Mobile BFF</text><text x="530" y="140" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">shaped payload</text>
  <rect x="450" y="170" width="160" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="530" y="190" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Internal svc</text><text x="530" y="210" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">mesh / RPC</text>
  <rect x="700" y="100" width="160" height="52" rx="8" fill="#111c30" stroke="#e6edf7" stroke-width="1.4"/><text x="780" y="120" text-anchor="middle" fill="#e6edf7" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">Hybrid edge</text><text x="780" y="140" text-anchor="middle" fill="#8fa1bd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9">REST out, gRPC in</text>
  <path d="M106 120L200 56" stroke="#8fa1bd" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
