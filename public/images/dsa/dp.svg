<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="probG"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="subG"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="baseG"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="overlapG"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="tabG"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
  </defs>
  <rect width="800" height="460" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Dynamic Programming — Optimal Substructure + Overlapping Subproblems</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Break into smaller subproblems, solve each once, store and reuse results</text>

  <!-- Overlapping Subproblems -->
  <rect x="20" y="65" width="370" height="190" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Overlapping Subproblems: Fibonacci (recompute tree)</text>

  <g transform="translate(25, 95)">
    <text x="185" y="10" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">fib(5)</text>

    <line x1="175" y1="16" x2="120" y2="40" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="195" y1="16" x2="250" y2="40" stroke="#94a3b8" stroke-width="1.2"/>

    <text x="115" y="45" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">fib(4)</text>
    <text x="255" y="45" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">fib(3)</text>

    <line x1="108" y1="50" x2="70" y2="72" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="122" y1="50" x2="155" y2="72" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="248" y1="50" x2="210" y2="72" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="262" y1="50" x2="295" y2="72" stroke="#94a3b8" stroke-width="1.2"/>

    <text x="65" y="77" text-anchor="middle" font-size="9" fill="#64748b">fib(3)</text>
    <text x="160" y="77" text-anchor="middle" font-size="9" fill="#64748b">fib(2)</text>
    <text x="205" y="77" text-anchor="middle" font-size="9" fill="#64748b">fib(2)</text>
    <text x="300" y="77" text-anchor="middle" font-size="9" fill="#64748b">fib(1)</text>

    <line x1="58" y1="82" x2="30" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="72" y1="82" x2="95" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="153" y1="82" x2="130" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="167" y1="82" x2="185" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="198" y1="82" x2="175" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="212" y1="82" x2="230" y2="102" stroke="#94a3b8" stroke-width="1.2"/>

    <text x="25" y="108" text-anchor="middle" font-size="8" fill="#f59e0b" font-weight="700">fib(2)</text>
    <text x="100" y="108" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">fib(1)</text>
    <text x="125" y="108" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">fib(1)</text>
    <text x="190" y="108" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">fib(0)</text>
    <text x="175" y="108" text-anchor="middle" font-size="8" fill="#f59e0b" font-weight="700">fib(1)</text>
    <text x="235" y="108" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">fib(0)</text>

    <!-- Highlight overlapping subproblems -->
    <ellipse cx="65" cy="78" rx="30" ry="14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <ellipse cx="205" cy="78" rx="30" ry="14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="135" y="132" text-anchor="middle" font-size="9" fill="#f59e0b" font-weight="600">fib(3) and fib(2) computed multiple times!</text>
    <text x="135" y="148" text-anchor="middle" font-size="9" fill="#16a34a">DP: store result → O(n), without DP: O(2ⁿ)</text>
  </g>

  <!-- DP Table -->
  <rect x="410" y="65" width="370" height="190" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">DP Table: Bottom-Up (Tabulation)</text>

  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="340" height="140" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="20" font-size="10" font-weight="700" fill="#475569">Problem: Coin Change — minimum coins for amount 11</text>
    <text x="15" y="36" font-size="10" fill="#64748b">Coins: [1, 2, 5]</text>

    <!-- DP array -->
    <text x="12" y="58" font-size="9" font-weight="600" fill="#475569">dp[ ]</text>
    <rect x="35" y="45" width="36" height="26" rx="3" fill="url(#baseG)"/><text x="53" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">0</text>
    <rect x="75" y="45" width="36" height="26" rx="3" fill="url(#subG)"/><text x="93" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
    <rect x="115" y="45" width="36" height="26" rx="3" fill="url(#subG)"/><text x="133" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
    <rect x="155" y="45" width="36" height="26" rx="3" fill="url(#subG)"/><text x="173" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
    <rect x="195" y="45" width="36" height="26" rx="3" fill="url(#subG)"/><text x="213" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
    <rect x="235" y="45" width="36" height="26" rx="3" fill="url(#probG)"/><text x="253" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
    <rect x="275" y="45" width="36" height="26" rx="3" fill="url(#subG)"/><text x="293" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

    <text x="53" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">0</text>
    <text x="93" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">1</text>
    <text x="133" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">2</text>
    <text x="173" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">3</text>
    <text x="213" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">4</text>
    <text x="253" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">5</text>
    <text x="293" y="84" text-anchor="middle" font-size="8" fill="#94a3b8">6</text>

    <text x="10" y="108" font-size="9" fill="#64748b">dp[i] = min(dp[i - coin] + 1) for each coin</text>
    <text x="10" y="124" font-size="9" fill="#64748b">dp[11] = min(dp[10]+1, dp[9]+1, dp[6]+1) = 3 coins</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 270)">
    <rect x="0" y="0" width="760" height="175" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Two DP Approaches &amp; When to Use DP</text>

    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="230" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Top-Down (Memoization)</text>
      <text x="10" y="36" font-size="9" fill="#64748b">Recursive + cache</text>
      <text x="10" y="52" font-size="9" fill="#64748b">Start from original problem</text>
      <text x="10" y="68" font-size="9" fill="#64748b">Only compute needed subproblems</text>
      <text x="10" y="84" font-size="9" fill="#64748b">Risk: stack overflow for deep recursion</text>
      <text x="10" y="100" font-size="9" fill="#64748b">Easier to reason about</text>
      <text x="10" y="116" font-size="9" fill="#64748b">Space: O(n) cache + O(n) stack</text>
    </g>

    <g transform="translate(265, 32)">
      <rect x="0" y="0" width="230" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Bottom-Up (Tabulation)</text>
      <text x="10" y="36" font-size="9" fill="#64748b">Iterative + table</text>
      <text x="10" y="52" font-size="9" fill="#64748b">Start from base cases</text>
      <text x="10" y="68" font-size="9" fill="#64748b">Fill table sequentially</text>
      <text x="10" y="84" font-size="9" fill="#64748b">No recursion overhead</text>
      <text x="10" y="100" font-size="9" fill="#64748b">May compute unused subproblems</text>
      <text x="10" y="116" font-size="9" fill="#64748b">Space: O(n) table (can optimize)</text>
    </g>

    <g transform="translate(510, 32)">
      <rect x="0" y="0" width="230" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">How to Identify DP</text>
      <text x="10" y="36" font-size="9" fill="#64748b" font-weight="600">Ask these questions:</text>
      <text x="10" y="54" font-size="9" fill="#64748b">① Does it ask for min/max/count?</text>
      <text x="10" y="70" font-size="9" fill="#64748b">② Can you express dp(i) in terms</text>
      <text x="15" y="84" font-size="9" fill="#64748b">of smaller dp values?</text>
      <text x="10" y="100" font-size="9" fill="#64748b">③ Does brute force revisit</text>
      <text x="15" y="114" font-size="9" fill="#64748b">the same subproblems?</text>
    </g>
  </g>
</svg>