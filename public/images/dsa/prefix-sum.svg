<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="origG"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="prefG"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="rangeG"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
  </defs>
  <rect width="800" height="400" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Prefix Sum — O(1) Range Sum Queries</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Precompute cumulative sums; query sum(i..j) = prefix[j] - prefix[i-1]</text>

  <!-- Original Array -->
  <rect x="30" y="65" width="740" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Original Array arr[ ]</text>

  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="32" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
    <rect x="74" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="106" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="148" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="180" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
    <rect x="222" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="254" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
    <rect x="296" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="328" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
    <rect x="370" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="402" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="444" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="476" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
    <rect x="518" y="0" width="64" height="36" rx="5" fill="url(#origG)"/><text x="550" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>

    <text x="32" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">0</text>
    <text x="106" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">1</text>
    <text x="180" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">2</text>
    <text x="254" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">3</text>
    <text x="328" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">4</text>
    <text x="402" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">5</text>
    <text x="476" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">6</text>
    <text x="550" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">7</text>
  </g>

  <!-- Prefix Array -->
  <rect x="30" y="160" width="740" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Prefix Sum Array prefix[ ] → prefix[i] = sum(arr[0..i])</text>

  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="32" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
    <rect x="74" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="106" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
    <rect x="148" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="180" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">8</text>
    <rect x="222" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="254" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">10</text>
    <rect x="296" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="328" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">15</text>
    <rect x="370" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="402" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">16</text>
    <rect x="444" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="476" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">19</text>
    <rect x="518" y="0" width="64" height="36" rx="5" fill="url(#prefG)"/><text x="550" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">21</text>

    <text x="32" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">0</text>
    <text x="106" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">1</text>
    <text x="180" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">2</text>
    <text x="254" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">3</text>
    <text x="328" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">4</text>
    <text x="402" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">5</text>
    <text x="476" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">6</text>
    <text x="550" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">7</text>
  </g>

  <!-- Range Sum Query -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="740" height="125" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="370" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Range Query: sum(arr[2..5]) = prefix[5] - prefix[1]</text>

    <g transform="translate(100, 30)">
      <!-- Visual formula -->
      <rect x="0" y="0" width="130" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">prefix[5]</text>
      <text x="65" y="35" text-anchor="middle" font-size="10" fill="#64748b">sum arr[0..5] = 16</text>

      <text x="140" y="30" font-size="16" fill="#64748b">−</text>

      <rect x="155" y="0" width="130" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="220" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">prefix[1]</text>
      <text x="220" y="35" text-anchor="middle" font-size="10" fill="#64748b">sum arr[0..1] = 4</text>

      <text x="295" y="30" font-size="16" fill="#64748b">=</text>

      <rect x="310" y="0" width="150" height="50" rx="6" fill="rgba(34,197,94,0.1)" stroke="#16a34a" stroke-width="1.5"/>
      <text x="385" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">sum(arr[2..5]) = 12</text>
      <text x="385" y="35" text-anchor="middle" font-size="10" fill="#64748b">4 + 2 + 5 + 1 = 12 ✓</text>
    </g>

    <text x="370" y="100" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">General formula: sum(L..R) = prefix[R] - prefix[L-1] (with prefix[-1] = 0)</text>
    <text x="370" y="115" text-anchor="middle" font-size="9" fill="#64748b">Build O(n), each query O(1) — ideal for repeated range queries on static arrays</text>
  </g>
</svg>