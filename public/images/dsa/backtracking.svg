<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <linearGradient id="choiceG"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="validG"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="invalidG"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="pruneG"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="800" height="460" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Backtracking — Explore, Recurse, Un-choose</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Systematically enumerate all candidates — prune branches that can't lead to a solution</text>

  <!-- Decision Tree -->
  <rect x="20" y="65" width="370" height="230" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Decision Tree: Generate All Subsets of [1, 2, 3]</text>

  <g transform="translate(25, 95)">
    <!-- Root -->
    <circle cx="185" cy="5" r="16" fill="url(#choiceG)"/>
    <text x="185" y="10" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">[]</text>

    <!-- Level 1: include 1? -->
    <line x1="175" y1="18" x2="120" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="195" y1="18" x2="250" y2="50" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="135" y="35" font-size="8" fill="#16a34a">include 1</text>
    <text x="225" y="35" font-size="8" fill="#ef4444">skip 1</text>

    <circle cx="120" cy="55" r="16" fill="url(#validG)"/><text x="120" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[1]</text>
    <circle cx="250" cy="55" r="16" fill="url(#choiceG)"/><text x="250" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[]</text>

    <!-- Level 2: include 2? -->
    <line x1="112" y1="68" x2="70" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="128" y1="68" x2="160" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="242" y1="68" x2="210" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="258" y1="68" x2="295" y2="100" stroke="#94a3b8" stroke-width="1.5"/>

    <circle cx="65" cy="105" r="16" fill="url(#validG)"/><text x="65" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[1,2]</text>
    <circle cx="165" cy="105" r="16" fill="url(#validG)"/><text x="165" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[1]</text>
    <circle cx="205" cy="105" r="16" fill="url(#validG)"/><text x="205" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[2]</text>
    <circle cx="300" cy="105" r="16" fill="url(#choiceG)"/><text x="300" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">[]</text>

    <!-- Level 3: include 3? -->
    <line x1="58" y1="118" x2="28" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="72" y1="118" x2="95" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="158" y1="118" x2="130" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="172" y1="118" x2="195" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="198" y1="118" x2="175" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="212" y1="118" x2="235" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="293" y1="118" x2="268" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="307" y1="118" x2="328" y2="150" stroke="#94a3b8" stroke-width="1.5"/>

    <circle cx="25" cy="155" r="14" fill="url(#validG)"/><text x="25" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[1,2,3]</text>
    <circle cx="98" cy="155" r="14" fill="url(#validG)"/><text x="98" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[1,2]</text>
    <circle cx="128" cy="155" r="14" fill="url(#validG)"/><text x="128" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[1,3]</text>
    <circle cx="198" cy="155" r="14" fill="url(#validG)"/><text x="198" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[1]</text>
    <circle cx="172" cy="155" r="14" fill="url(#validG)"/><text x="172" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[2,3]</text>
    <circle cx="238" cy="155" r="14" fill="url(#validG)"/><text x="238" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[2]</text>
    <circle cx="265" cy="155" r="14" fill="url(#validG)"/><text x="265" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[3]</text>
    <circle cx="332" cy="155" r="14" fill="url(#choiceG)"/><text x="332" y="160" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">[]</text>
  </g>

  <!-- Algorithm template -->
  <rect x="410" y="65" width="370" height="230" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">Backtracking Template</text>

  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="350" height="180" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="20" font-size="10" font-weight="700" fill="#475569">function backtrack(path, options):</text>
    <text x="15" y="40" font-size="10" fill="#64748b">  if goal_reached(path):</text>
    <text x="25" y="56" font-size="10" fill="#16a34a">    result.add([...path])</text>
    <text x="15" y="72" font-size="10" fill="#64748b">    return</text>
    <text x="15" y="90" font-size="10" fill="#64748b">  for each choice in options:</text>
    <text x="15" y="108" font-size="10" fill="#475569">    make_choice(path, choice)   // choose</text>
    <text x="15" y="126" font-size="10" fill="#475569">    backtrack(path, remaining)  // explore</text>
    <text x="15" y="144" font-size="10" fill="#475569">    undo_choice(path, choice)   // un-choose</text>
    <text x="15" y="165" font-size="10" fill="#ef4444" font-weight="600">  // Early prune: if invalid, skip (no recursion)</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 310)">
    <rect x="0" y="0" width="760" height="135" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Key Concepts &amp; Optimization Techniques</text>

    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="230" height="90" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Choose / Explore / Un-choose</text>
      <text x="10" y="34" font-size="9" fill="#64748b">Add element to current path</text>
      <text x="10" y="48" font-size="9" fill="#64748b">Recurse with remaining options</text>
      <text x="10" y="62" font-size="9" fill="#64748b">Remove element (backtrack)</text>
      <text x="10" y="76" font-size="9" fill="#64748b">Tree depth = recursion depth</text>
    </g>

    <g transform="translate(265, 32)">
      <rect x="0" y="0" width="230" height="90" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Pruning Strategies</text>
      <text x="10" y="34" font-size="9" fill="#64748b">• Feasibility check before recursion</text>
      <text x="10" y="48" font-size="9" fill="#64748b">• Sort to group equal elements</text>
      <text x="10" y="62" font-size="9" fill="#64748b">• Use visited set to avoid repeats</text>
      <text x="10" y="76" font-size="9" fill="#64748b">• Bound check (branch &amp; bound)</text>
    </g>

    <g transform="translate(510, 32)">
      <rect x="0" y="0" width="230" height="90" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Classic Problems</text>
      <text x="10" y="34" font-size="9" fill="#64748b">• Subsets / Combinations / Permutations</text>
      <text x="10" y="48" font-size="9" fill="#64748b">• N-Queens / Sudoku Solver</text>
      <text x="10" y="62" font-size="9" fill="#64748b">• Combination Sum</text>
      <text x="10" y="76" font-size="9" fill="#64748b">• Word Search / Palindrome Partition</text>
    </g>
  </g>
</svg>