<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="aGrad1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="aGrad2"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="aGrad3"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="aGrad4"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="aGrad5"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
  </defs>
  <rect width="800" height="400" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Arrays &amp; Strings — Sequential Data</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Contiguous memory, O(1) random access by index, O(n) insert/delete</text>

  <!-- Array layout -->
  <rect x="30" y="65" width="740" height="140" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Array — Contiguous in Memory</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="10" width="64" height="44" rx="5" fill="url(#aGrad1)"/><text x="32" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">10</text>
    <rect x="74" y="10" width="64" height="44" rx="5" fill="url(#aGrad2)"/><text x="106" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">20</text>
    <rect x="148" y="10" width="64" height="44" rx="5" fill="url(#aGrad3)"/><text x="180" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">30</text>
    <rect x="222" y="10" width="64" height="44" rx="5" fill="url(#aGrad4)"/><text x="254" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">40</text>
    <rect x="296" y="10" width="64" height="44" rx="5" fill="url(#aGrad5)"/><text x="328" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">50</text>

    <text x="32" y="72" text-anchor="middle" font-size="10" fill="#94a3b8">index 0</text>
    <text x="106" y="72" text-anchor="middle" font-size="10" fill="#94a3b8">index 1</text>
    <text x="180" y="72" text-anchor="middle" font-size="10" fill="#94a3b8">index 2</text>
    <text x="254" y="72" text-anchor="middle" font-size="10" fill="#94a3b8">index 3</text>
    <text x="328" y="72" text-anchor="middle" font-size="10" fill="#94a3b8">index 4</text>

    <text x="0" y="95" font-size="9" fill="#64748b">arr[0]</text>
    <text x="74" y="95" font-size="9" fill="#64748b">arr[1]</text>
    <text x="148" y="95" font-size="9" fill="#64748b">arr[2]</text>
    <text x="222" y="95" font-size="9" fill="#64748b">arr[3]</text>
    <text x="296" y="95" font-size="9" fill="#64748b">arr[4]</text>
  </g>

  <!-- String vs Array note -->
  <rect x="35" y="80" width="140" height="24" rx="4" fill="rgba(99,102,241,0.1)"/>
  <text x="105" y="96" text-anchor="middle" font-size="9" fill="#6366f1" font-weight="600">String = char array</text>

  <!-- Common operations -->
  <rect x="30" y="220" width="740" height="165" rx="10" fill="rgba(99,102,241,0.03)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Common Array &amp; String Operations</text>

  <!-- Operation 1: Reverse -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Reverse</text>
    <text x="10" y="32" font-size="9" fill="#475569">[1, 2, 3, 4] → [4, 3, 2, 1]</text>
    <text x="10" y="46" font-size="8" fill="#64748b">Two pointers: left ↔ right swap</text>
  </g>

  <!-- Operation 2: Rotate -->
  <g transform="translate(290, 260)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Rotate</text>
    <text x="10" y="32" font-size="9" fill="#475569">[1,2,3,4,5] rotate 2 → [4,5,1,2,3]</text>
    <text x="10" y="46" font-size="8" fill="#64748b">Reverse segments or juggle indices</text>
  </g>

  <!-- Operation 3: In-place filter -->
  <g transform="translate(530, 260)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">In-place Filter</text>
    <text x="10" y="32" font-size="9" fill="#475569">Remove 2: [1,2,3,2,4] → [1,3,4]</text>
    <text x="10" y="46" font-size="8" fill="#64748b">Slow/fast pointer overwrite</text>
  </g>

  <!-- Key insight -->
  <text x="400" y="352" text-anchor="middle" font-size="10" fill="#64748b">For character problems (anagrams, palindromes), remember the alphabet is only 26 letters</text>
  <text x="400" y="370" text-anchor="middle" font-size="10" fill="#64748b">Often a preprocessing step (sorting, prefix sum, hashing) unlocks the optimal solution</text>
</svg>