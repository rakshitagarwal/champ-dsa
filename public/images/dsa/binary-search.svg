<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <linearGradient id="boxGrad"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="boxL"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="boxM"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="boxR"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="boxDone"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Binary Search — Halving the Search Space</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Requires sorted input or monotonic predicate — O(log n) time, O(1) space</text>

  <!-- Standard Binary Search -->
  <rect x="20" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Standard Binary Search: Find target = 7</text>

  <g transform="translate(30, 100)">
    <!-- Initial state -->
    <text x="10" y="12" font-size="9" font-weight="600" fill="#475569">Step 1: [1, 3, 5, 7, 9, 11, 13]</text>

    <rect x="0" y="22" width="38" height="32" rx="4" fill="url(#boxL)"/><text x="19" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <rect x="44" y="22" width="38" height="32" rx="4" fill="url(#boxGrad)"/><text x="63" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <rect x="88" y="22" width="38" height="32" rx="4" fill="url(#boxGrad)"/><text x="107" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <rect x="132" y="22" width="38" height="32" rx="4" fill="url(#boxM)"/><text x="151" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
    <rect x="176" y="22" width="38" height="32" rx="4" fill="url(#boxGrad)"/><text x="195" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">9</text>
    <rect x="220" y="22" width="38" height="32" rx="4" fill="url(#boxGrad)"/><text x="239" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">11</text>
    <rect x="264" y="22" width="38" height="32" rx="4" fill="url(#boxR)"/><text x="283" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">13</text>

    <!-- L, M, R labels -->
    <path d="M19,15 L19,-2" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="19" y="-6" text-anchor="middle" font-size="9" font-weight="700" fill="#0891b2">L</text>
    <path d="M151,15 L151,-2" stroke="#16a34a" stroke-width="1.5"/>
    <text x="151" y="-6" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a">M</text>
    <path d="M283,15 L283,-2" stroke="#d97706" stroke-width="1.5"/>
    <text x="283" y="-6" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706">R</text>

    <text x="10" y="72" font-size="9" fill="#475569">mid = 7, target = 7 → found! ✓</text>
    <text x="10" y="90" font-size="9" fill="#64748b" font-style="italic">if target &lt; mid: R = mid-1</text>
    <text x="10" y="104" font-size="9" fill="#64748b" font-style="italic">if target &gt; mid: L = mid+1</text>
    <text x="10" y="118" font-size="9" fill="#64748b" font-style="italic">if target == mid: return mid</text>
  </g>

  <!-- Binary Search on Answer -->
  <rect x="410" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">Binary Search on Answer (Predicate)</text>
  <text x="595" y="100" text-anchor="middle" font-size="10" fill="#64748b">Find first/last true in monotonic boolean space</text>

  <g transform="translate(420, 115)">
    <!-- Predicate visualization -->
    <rect x="0" y="0" width="340" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="5" y="5" width="32" height="18" rx="3" fill="rgba(239,68,68,0.15)"/><text x="21" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">F</text>
    <rect x="41" y="5" width="32" height="18" rx="3" fill="rgba(239,68,68,0.15)"/><text x="57" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">F</text>
    <rect x="77" y="5" width="32" height="18" rx="3" fill="rgba(239,68,68,0.15)"/><text x="93" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">F</text>
    <rect x="113" y="5" width="32" height="18" rx="3" fill="rgba(239,68,68,0.15)"/><text x="129" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">F</text>
    <rect x="149" y="5" width="32" height="18" rx="3" fill="rgba(34,197,94,0.15)"/><text x="165" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">T</text>
    <rect x="185" y="5" width="32" height="18" rx="3" fill="rgba(34,197,94,0.15)"/><text x="201" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">T</text>
    <rect x="221" y="5" width="32" height="18" rx="3" fill="rgba(34,197,94,0.15)"/><text x="237" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">T</text>
    <rect x="257" y="5" width="32" height="18" rx="3" fill="rgba(34,197,94,0.15)"/><text x="273" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">T</text>
    <rect x="293" y="5" width="32" height="18" rx="3" fill="rgba(34,197,94,0.15)"/><text x="309" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">T</text>

    <text x="10" y="40" font-size="9" fill="#ef4444" font-weight="600">false</text>
    <text x="135" y="40" font-size="9" fill="#16a34a" font-weight="600">true</text>
    <text x="163" y="32" font-size="8" fill="#f59e0b" font-weight="700">↑ first true</text>
    <line x1="165" y1="24" x2="165" y2="28" stroke="#f59e0b" stroke-width="2"/>

    <text x="10" y="62" font-size="9" fill="#475569">Predicate: Can we ship within D days?</text>
    <text x="10" y="78" font-size="9" fill="#64748b" font-style="italic">Binary search on capacity — check(capacity) returns monotonic T/F</text>
    <text x="10" y="94" font-size="9" fill="#64748b" font-style="italic">Find minimum capacity where predicate is true</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 255)">
    <rect x="0" y="0" width="760" height="150" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Two Variants &amp; Common Pitfalls</text>

    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Find Exact Target</text>
      <text x="10" y="36" font-size="9" fill="#64748b">Standard: while L ≤ R</text>
      <text x="10" y="52" font-size="9" fill="#64748b">mid = (L+R) / 2 — watch overflow!</text>
      <text x="10" y="68" font-size="9" fill="#64748b">Use: L + (R-L)/2 to avoid overflow</text>
      <text x="10" y="84" font-size="9" fill="#64748b">Return index or -1 if not found</text>
    </g>

    <g transform="translate(265, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">First/Last True</text>
      <text x="10" y="36" font-size="9" fill="#64748b">while L &lt; R (narrow to 1 element)</text>
      <text x="10" y="52" font-size="9" fill="#64748b">mid = (L+R) / 2 for lower bound</text>
      <text x="10" y="68" font-size="9" fill="#64748b">mid = (L+R+1)/2 for upper bound</text>
      <text x="10" y="84" font-size="9" fill="#64748b">predicate(mid) → eliminate half</text>
    </g>

    <g transform="translate(510, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#ef4444">Common Mistakes</text>
      <text x="10" y="36" font-size="9" fill="#64748b">• Off-by-one on L/R boundaries</text>
      <text x="10" y="52" font-size="9" fill="#64748b">• Integer overflow in mid calc</text>
      <text x="10" y="68" font-size="9" fill="#64748b">• Infinite loop (wrong mid rounding)</text>
      <text x="10" y="84" font-size="9" fill="#64748b">• Unimodal ≠ monotonic (rotated)</text>
    </g>
  </g>
</svg>