<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <linearGradient id="boxGrad1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="boxGrad2"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="boxGrad3"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="boxGrad4"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Two Pointers Technique</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Two pointer variables to track positions, eliminating candidates each step — O(n) time, O(1) space</text>

  <!-- Opposite Direction -->
  <rect x="20" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">1. Opposite Direction</text>
  <text x="205" y="100" text-anchor="middle" font-size="10" fill="#64748b">Sorted array: find pair with target sum = 7</text>

  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="50" height="36" rx="5" fill="url(#boxGrad1)"/><text x="25" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="58" y="0" width="50" height="36" rx="5" fill="url(#boxGrad2)"/><text x="83" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="116" y="0" width="50" height="36" rx="5" fill="url(#boxGrad3)"/><text x="141" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <rect x="174" y="0" width="50" height="36" rx="5" fill="url(#boxGrad4)"/><text x="199" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="232" y="0" width="50" height="36" rx="5" fill="url(#boxGrad1)"/><text x="257" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <rect x="290" y="0" width="50" height="36" rx="5" fill="url(#boxGrad2)"/><text x="315" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>

    <!-- Left pointer -->
    <path d="M25,-8 L25,-30 L0,-30" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="-10" y="-48" width="40" height="18" rx="4" fill="rgba(139,92,246,0.12)"/>
    <text x="10" y="-35" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">L</text>

    <!-- Right pointer -->
    <path d="M315,-8 L315,-30 L340,-30" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="300" y="-48" width="40" height="18" rx="4" fill="rgba(239,68,68,0.12)"/>
    <text x="320" y="-35" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">R</text>

    <!-- Logic -->
    <text x="10" y="58" font-size="9" fill="#475569">if L + R == target → found</text>
    <text x="10" y="72" font-size="9" fill="#475569">if L + R &lt; target → L++ (need bigger sum)</text>
    <text x="10" y="86" font-size="9" fill="#475569">if L + R &gt; target → R-- (need smaller sum)</text>
    <text x="10" y="105" font-size="9" fill="#64748b" font-style="italic">Here: 1 + 6 = 7 → match found at L=0, R=5</text>
  </g>

  <!-- Same Direction (Slow/Fast) -->
  <rect x="410" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">2. Same Direction (Slow &amp; Fast)</text>
  <text x="595" y="100" text-anchor="middle" font-size="10" fill="#64748b">Remove duplicates in-place: [1,1,2,2,3,4,4]</text>

  <g transform="translate(420, 115)">
    <rect x="0" y="0" width="48" height="36" rx="5" fill="url(#boxGrad1)"/><text x="24" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="55" y="0" width="48" height="36" rx="5" fill="url(#boxGrad1)"/><text x="79" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="110" y="0" width="48" height="36" rx="5" fill="url(#boxGrad2)"/><text x="134" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="165" y="0" width="48" height="36" rx="5" fill="url(#boxGrad2)"/><text x="189" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="220" y="0" width="48" height="36" rx="5" fill="url(#boxGrad3)"/><text x="244" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <rect x="275" y="0" width="48" height="36" rx="5" fill="url(#boxGrad4)"/><text x="299" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="330" y="0" width="48" height="36" rx="5" fill="url(#boxGrad4)"/><text x="354" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>

    <path d="M79,-8 L79,-30" stroke="#06b6d4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="55" y="-48" width="48" height="18" rx="4" fill="rgba(6,182,212,0.12)"/>
    <text x="79" y="-35" text-anchor="middle" font-size="10" font-weight="600" fill="#0891b2">slow</text>

    <path d="M354,-8 L354,-30" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="330" y="-48" width="48" height="18" rx="4" fill="rgba(245,158,11,0.12)"/>
    <text x="354" y="-35" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">fast</text>

    <text x="10" y="58" font-size="9" fill="#475569">fast scans each element once</text>
    <text x="10" y="72" font-size="9" fill="#475569">slow tracks where to write next unique</text>
    <text x="10" y="86" font-size="9" fill="#475569">When arr[fast] ≠ arr[slow], advance slow &amp; copy</text>
    <text x="10" y="105" font-size="9" fill="#64748b" font-style="italic">Result: [1, 2, 3, 4] — remaining slots ignored</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 255)">
    <rect x="0" y="0" width="760" height="150" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">When to Use Which Variant</text>

    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="15" cy="18" r="6" fill="#7c3aed"/>
      <text x="28" y="22" font-size="10" font-weight="700" fill="#475569">Opposite Direction</text>
      <text x="10" y="42" font-size="9" fill="#64748b">• Sorted array pair sum</text>
      <text x="10" y="58" font-size="9" fill="#64748b">• Palindrome check</text>
      <text x="10" y="74" font-size="9" fill="#64748b">• Reverse / rotate array</text>
      <text x="10" y="90" font-size="9" fill="#64748b">• Container with most water</text>
    </g>

    <g transform="translate(265, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="15" cy="18" r="6" fill="#0891b2"/>
      <text x="28" y="22" font-size="10" font-weight="700" fill="#475569">Same Direction</text>
      <text x="10" y="42" font-size="9" fill="#64748b">• Remove duplicates</text>
      <text x="10" y="58" font-size="9" fill="#64748b">• Remove element in-place</text>
      <text x="10" y="74" font-size="9" fill="#64748b">• Move zeroes to end</text>
      <text x="10" y="90" font-size="9" fill="#64748b">• Linked list middle / cycle</text>
    </g>

    <g transform="translate(510, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="15" cy="18" r="6" fill="#16a34a"/>
      <text x="28" y="22" font-size="10" font-weight="700" fill="#475569">Complexity</text>
      <text x="10" y="42" font-size="9" fill="#64748b">Time: O(n) — single pass</text>
      <text x="10" y="58" font-size="9" fill="#64748b">Space: O(1) — no extra memory</text>
      <text x="10" y="74" font-size="9" fill="#64748b">Requires sorted input for</text>
      <text x="10" y="88" font-size="9" fill="#64748b">opposite direction variant</text>
    </g>
  </g>
</svg>