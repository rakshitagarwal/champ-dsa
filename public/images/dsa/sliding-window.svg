<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <linearGradient id="winGrad"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="inGrad"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="outGrad"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="defGrad"><stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Sliding Window</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Maintain a contiguous subarray/substring via two pointers — expand right, shrink left</text>

  <!-- Fixed Window -->
  <rect x="20" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Fixed Window (size = k)</text>
  <text x="205" y="100" text-anchor="middle" font-size="10" fill="#64748b">Max sum subarray of size 3</text>

  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="44" height="36" rx="4" fill="url(#defGrad)"/><text x="22" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">2</text>
    <rect x="52" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="74" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="104" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="126" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <rect x="156" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="178" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <rect x="208" y="0" width="44" height="36" rx="4" fill="url(#defGrad)"/><text x="230" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">1</text>
    <rect x="260" y="0" width="44" height="36" rx="4" fill="url(#defGrad)"/><text x="282" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">6</text>

    <!-- Window bracket -->
    <path d="M48,-8 L48,-20" stroke="#16a34a" stroke-width="2"/>
    <path d="M200,-8 L200,-20" stroke="#16a34a" stroke-width="2"/>
    <line x1="48" y1="-14" x2="200" y2="-14" stroke="#16a34a" stroke-width="2"/>
    <text x="124" y="-22" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">window (size 3)</text>

    <text x="10" y="55" font-size="9" fill="#475569">Add right element (+arr[right])</text>
    <text x="10" y="69" font-size="9" fill="#475569">Remove left element (-arr[left])</text>
    <text x="10" y="83" font-size="9" fill="#475569">Slide: left++, right++</text>
    <text x="10" y="100" font-size="9" fill="#64748b" font-style="italic">sum = 4+3+5 = 12 (max)</text>
  </g>

  <!-- Dynamic Window -->
  <rect x="410" y="65" width="370" height="170" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">Dynamic Window (variable size)</text>
  <text x="595" y="100" text-anchor="middle" font-size="10" fill="#64748b">Smallest subarray with sum ≥ 7</text>

  <g transform="translate(420, 115)">
    <rect x="0" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="22" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="52" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="74" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <rect x="104" y="0" width="44" height="36" rx="4" fill="url(#inGrad)"/><text x="126" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="156" y="0" width="44" height="36" rx="4" fill="url(#outGrad)"/><text x="178" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="208" y="0" width="44" height="36" rx="4" fill="url(#defGrad)"/><text x="230" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">4</text>
    <rect x="260" y="0" width="44" height="36" rx="4" fill="url(#defGrad)"/><text x="282" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">5</text>

    <!-- Left pointer -->
    <path d="M22,-8 L22,-25 L-5,-25" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="-15" y="-42" width="40" height="18" rx="4" fill="rgba(239,68,68,0.12)"/>
    <text x="5" y="-30" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">left</text>

    <!-- Right pointer -->
    <path d="M126,-8 L126,-25 L155,-25" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="135" y="-42" width="40" height="18" rx="4" fill="rgba(34,197,94,0.12)"/>
    <text x="155" y="-30" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">right</text>

    <!-- Cut line -->
    <line x1="155" y1="2" x2="155" y2="34" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>

    <text x="10" y="55" font-size="9" fill="#475569">Expand right until condition met</text>
    <text x="10" y="69" font-size="9" fill="#475569">Shrink left while condition holds</text>
    <text x="10" y="83" font-size="9" fill="#475569">Track min/max window size</text>
    <text x="10" y="100" font-size="9" fill="#64748b" font-style="italic">2+3+1+2=8 ≥ 7, window=4 → shrink</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 255)">
    <rect x="0" y="0" width="760" height="150" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Fixed vs Dynamic — When to Use Each</text>

    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Fixed Window</text>
      <text x="10" y="36" font-size="9" fill="#64748b">• Max/min sum of k elements</text>
      <text x="10" y="52" font-size="9" fill="#64748b">• Anagram in a string</text>
      <text x="10" y="68" font-size="9" fill="#64748b">• Average of subarrays</text>
      <text x="10" y="84" font-size="9" fill="#64748b">• K-length substrings</text>
    </g>

    <g transform="translate(265, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Dynamic Window</text>
      <text x="10" y="36" font-size="9" fill="#64748b">• Min window with sum ≥ target</text>
      <text x="10" y="52" font-size="9" fill="#64748b">• Longest substring w/o repeats</text>
      <text x="10" y="68" font-size="9" fill="#64748b">• Longest with k distinct chars</text>
      <text x="10" y="84" font-size="9" fill="#64748b">• Subarrays with bounded max</text>
    </g>

    <g transform="translate(510, 35)">
      <rect x="0" y="0" width="230" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Pattern Template</text>
      <text x="10" y="36" font-size="9" fill="#64748b">while right &lt; n:</text>
      <text x="10" y="50" font-size="9" fill="#64748b">  add(arr[right]), right++</text>
      <text x="10" y="64" font-size="9" fill="#64748b">  while invalid:</text>
      <text x="10" y="78" font-size="9" fill="#64748b">  remove(arr[left]), left++</text>
      <text x="10" y="92" font-size="9" fill="#64748b">  update(result)</text>
    </g>
  </g>
</svg>