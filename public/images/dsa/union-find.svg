<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <linearGradient id="setA"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="setB"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="setC"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="mergeG"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="800" height="460" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Union-Find (Disjoint Set Union)</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Track connectivity in dynamic graphs — near O(1) per operation with path compression + union by rank</text>

  <!-- Initial state -->
  <rect x="20" y="65" width="240" height="180" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Initial: Each node is its own set</text>

  <g transform="translate(30, 100)">
    <circle cx="30" cy="20" r="18" fill="url(#setA)"/><text x="30" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">0</text>
    <circle cx="100" cy="20" r="18" fill="url(#setB)"/><text x="100" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <circle cx="170" cy="20" r="18" fill="url(#setC)"/><text x="170" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <circle cx="30" cy="70" r="18" fill="url(#setA)"/><text x="30" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <circle cx="100" cy="70" r="18" fill="url(#setB)"/><text x="100" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <circle cx="170" cy="70" r="18" fill="url(#setC)"/><text x="170" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>

    <text x="10" y="115" font-size="9" fill="#475569">parent[i] = i  (each node points to itself)</text>
    <text x="10" y="132" font-size="9" fill="#475569">rank[i] = 0  (tree height starts at 0)</text>
  </g>

  <!-- After unions -->
  <rect x="280" y="65" width="240" height="180" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">After union(0,1), union(2,3), union(0,4)</text>

  <g transform="translate(290, 100)">
    <!-- Tree 1: 0-1-4 -->
    <circle cx="60" cy="20" r="18" fill="url(#setA)"/><text x="60" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">0</text>
    <circle cx="30" cy="65" r="14" fill="url(#setA)"/><text x="30" y="69" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">1</text>
    <circle cx="90" cy="65" r="14" fill="url(#setA)"/><text x="90" y="69" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">4</text>

    <line x1="52" y1="34" x2="36" y2="50" stroke="#64748b" stroke-width="1.5"/>
    <line x1="68" y1="34" x2="84" y2="50" stroke="#64748b" stroke-width="1.5"/>

    <!-- Tree 2: 2-3 -->
    <circle cx="150" cy="20" r="18" fill="url(#setB)"/><text x="150" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <circle cx="150" cy="65" r="14" fill="url(#setB)"/><text x="150" y="69" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">3</text>
    <line x1="150" y1="38" x2="150" y2="50" stroke="#64748b" stroke-width="1.5"/>

    <!-- Node 5 alone -->
    <circle cx="60" cy="110" r="14" fill="url(#setC)"/><text x="60" y="114" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">5</text>

    <text x="10" y="145" font-size="9" fill="#475569">parent[0] = 0, parent[1] = 0, parent[4] = 0</text>
    <text x="10" y="162" font-size="9" fill="#475569">parent[2] = 2, parent[3] = 2</text>
    <text x="10" y="179" font-size="9" fill="#475569">parent[5] = 5  (still alone)</text>
  </g>

  <!-- Path Compression -->
  <rect x="540" y="65" width="240" height="180" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="660" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">Path Compression (find(4))</text>

  <g transform="translate(550, 100)">
    <!-- Before -->
    <text x="5" y="15" font-size="10" font-weight="600" fill="#475569">Before find(4):</text>
    <circle cx="120" cy="25" r="16" fill="url(#setA)"/><text x="120" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">0</text>
    <circle cx="90" cy="55" r="13" fill="url(#setA)"/><text x="90" y="59" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">1</text>
    <circle cx="150" cy="55" r="13" fill="url(#setA)"/><text x="150" y="59" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">4</text>
    <line x1="114" y1="37" x2="94" y2="44" stroke="#64748b" stroke-width="1.2"/>
    <line x1="126" y1="37" x2="146" y2="44" stroke="#64748b" stroke-width="1.2"/>

    <!-- Arrow -->
    <text x="110" y="85" text-anchor="middle" font-size="10" fill="#64748b">↓ find(4) compresses</text>

    <!-- After -->
    <circle cx="120" cy="100" r="16" fill="url(#setA)"/><text x="120" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">0</text>
    <circle cx="90" cy="130" r="13" fill="url(#setA)"/><text x="90" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">1</text>
    <circle cx="150" cy="130" r="13" fill="url(#setA)"/><text x="150" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">4</text>
    <line x1="114" y1="112" x2="94" y2="119" stroke="#64748b" stroke-width="1.2"/>
    <line x1="128" y1="112" x2="148" y2="128" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,2"/>

    <text x="5" y="155" font-size="9" fill="#64748b">parent[4] = parent[0] directly</text>
    <text x="5" y="170" font-size="9" fill="#64748b">Future find(4) = O(1)</text>
  </g>

  <!-- Operations summary -->
  <g transform="translate(20, 260)">
    <rect x="0" y="0" width="760" height="185" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Union-Find Operations &amp; Optimizations</text>

    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="230" height="140" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Core Operations</text>
      <text x="10" y="36" font-size="9" font-weight="600" fill="#475569">makeSet(n):</text>
      <text x="15" y="50" font-size="9" fill="#64748b">parent[i] = i, rank[i] = 0</text>

      <text x="10" y="68" font-size="9" font-weight="600" fill="#475569">find(x):</text>
      <text x="15" y="82" font-size="9" fill="#64748b">while parent[x] ≠ x: x = parent[x]</text>
      <text x="15" y="96" font-size="9" fill="#64748b">+ path compression: parent[x] = find(parent[x])</text>

      <text x="10" y="114" font-size="9" font-weight="600" fill="#475569">union(x, y):</text>
      <text x="15" y="128" font-size="9" fill="#64748b">attach smaller rank under larger rank</text>
    </g>

    <g transform="translate(265, 32)">
      <rect x="0" y="0" width="230" height="140" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Complexities</text>
      <text x="10" y="38" font-size="9" fill="#64748b">Without optimization:</text>
      <text x="15" y="54" font-size="9" fill="#64748b">find: O(n) (skewed tree)</text>
      <text x="10" y="74" font-size="9" fill="#64748b">With both optimizations:</text>
      <text x="15" y="90" font-size="9" fill="#64748b">find: O(α(n)) — amortized</text>
      <text x="15" y="106" font-size="9" fill="#64748b">union: O(α(n)) — amortized</text>
      <text x="10" y="126" font-size="9" fill="#64748b">α(n) = inverse Ackermann (practically ≤ 4)</text>
    </g>

    <g transform="translate(510, 32)">
      <rect x="0" y="0" width="230" height="140" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Common Problems</text>
      <text x="10" y="38" font-size="9" fill="#64748b">• Number of Connected Components</text>
      <text x="10" y="56" font-size="9" fill="#64748b">• Redundant Connection</text>
      <text x="10" y="74" font-size="9" fill="#64748b">• Accounts Merge</text>
      <text x="10" y="92" font-size="9" fill="#64748b">• Kruskal's MST (minimum spanning tree)</text>
      <text x="10" y="110" font-size="9" fill="#64748b">• Number of Islands II (dynamic additions)</text>
      <text x="10" y="128" font-size="9" fill="#64748b">• Friend Circles / Number of Provinces</text>
    </g>
  </g>
</svg>