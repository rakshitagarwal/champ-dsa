<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L5,10 L10,0 Z" fill="#94a3b8"/></marker>
    <radialGradient id="rootGrad"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient>
    <radialGradient id="lvl1Grad"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></radialGradient>
    <radialGradient id="lvl2Grad"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></radialGradient>
  </defs>

  <rect width="800" height="440" fill="#fafafa" rx="12"/>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Min-Heap: Tree View &amp; Array Representation</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Heap property (min-heap): parent ≤ both children  ●  Complete binary tree → compact array storage</text>

  <!-- Tree View -->
  <rect x="20" y="65" width="370" height="210" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Tree View</text>

  <g transform="translate(5, 85)">
    <!-- Edges tree -->
    <line x1="200" y1="25" x2="120" y2="70" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="200" y1="25" x2="280" y2="70" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="120" y1="70" x2="65" y2="115" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="120" y1="70" x2="175" y2="115" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="280" y1="70" x2="225" y2="115" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="280" y1="70" x2="335" y2="115" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>

    <!-- Level 0 (root) -->
    <circle cx="200" cy="15" r="26" fill="url(#rootGrad)"/>
    <text x="200" y="21" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="200" y="-10" text-anchor="middle" font-size="9" fill="#8b5cf6" font-weight="600">index 0</text>

    <!-- Level 1 -->
    <circle cx="120" cy="65" r="22" fill="url(#lvl1Grad)"/>
    <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">5</text>
    <text x="120" y="40" text-anchor="middle" font-size="9" fill="#0891b2" font-weight="600">index 1</text>

    <circle cx="280" cy="65" r="22" fill="url(#lvl1Grad)"/>
    <text x="280" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">8</text>
    <text x="280" y="40" text-anchor="middle" font-size="9" fill="#0891b2" font-weight="600">index 2</text>

    <!-- Level 2 (leaves) -->
    <circle cx="65" cy="110" r="18" fill="url(#lvl2Grad)"/>
    <text x="65" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">9</text>
    <text x="65" y="90" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">index 3</text>

    <circle cx="175" cy="110" r="18" fill="url(#lvl2Grad)"/>
    <text x="175" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">12</text>
    <text x="175" y="90" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">index 4</text>

    <circle cx="225" cy="110" r="18" fill="url(#lvl2Grad)"/>
    <text x="225" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">14</text>
    <text x="225" y="90" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">index 5</text>

    <circle cx="335" cy="110" r="18" fill="url(#lvl2Grad)"/>
    <text x="335" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">20</text>
    <text x="335" y="90" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">index 6</text>
  </g>

  <!-- Index formulas -->
  <g transform="translate(30, 230)">
    <text x="0" y="0" font-size="10" font-weight="600" fill="#475569">Index Formulas</text>
    <text x="0" y="16" font-size="9" fill="#64748b">parent(i) = floor((i - 1) / 2)</text>
    <text x="0" y="32" font-size="9" fill="#64748b">left(i)   = 2i + 1</text>
    <text x="0" y="48" font-size="9" fill="#64748b">right(i)  = 2i + 2</text>
  </g>

  <!-- Array View -->
  <rect x="410" y="65" width="370" height="210" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Array Storage [ ]</text>

  <g transform="translate(430, 100)">
    <!-- Index row -->
    <text x="30" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">0</text>
    <text x="80" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">1</text>
    <text x="130" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">2</text>
    <text x="180" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">3</text>
    <text x="230" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">4</text>
    <text x="280" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">5</text>
    <text x="330" y="0" text-anchor="middle" font-size="10" fill="#94a3b8">6</text>

    <!-- Value boxes -->
    <rect x="10" y="8" width="40" height="36" rx="5" fill="url(#rootGrad)"/>
    <text x="30" y="31" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>

    <rect x="60" y="8" width="40" height="36" rx="5" fill="url(#lvl1Grad)"/>
    <text x="80" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">5</text>

    <rect x="110" y="8" width="40" height="36" rx="5" fill="url(#lvl1Grad)"/>
    <text x="130" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">8</text>

    <rect x="160" y="8" width="40" height="36" rx="5" fill="url(#lvl2Grad)"/>
    <text x="180" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">9</text>

    <rect x="210" y="8" width="40" height="36" rx="5" fill="url(#lvl2Grad)"/>
    <text x="230" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">12</text>

    <rect x="260" y="8" width="40" height="36" rx="5" fill="url(#lvl2Grad)"/>
    <text x="280" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">14</text>

    <rect x="310" y="8" width="40" height="36" rx="5" fill="url(#lvl2Grad)"/>
    <text x="330" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">20</text>

    <!-- Pointer annotations -->
    <rect x="10" y="55" width="40" height="18" rx="3" fill="rgba(139,92,246,0.1)"/>
    <text x="30" y="67" text-anchor="middle" font-size="8" fill="#7c3aed">root</text>

    <!-- Children pointer arrows for index 1 -->
    <text x="100" y="62" font-size="8" fill="#0891b2" text-anchor="middle">left → idx 3</text>
    <text x="260" y="62" font-size="8" fill="#0891b2" text-anchor="middle">right → idx 4</text>
    <path d="M80,46 Q130,55 175,46" stroke="#06b6d4" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow-down)"/>
    <path d="M80,46 Q180,65 230,46" stroke="#06b6d4" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow-down)"/>
  </g>

  <!-- Heap Operations -->
  <rect x="20" y="290" width="760" height="135" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Core Operations</text>

  <!-- Push -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Push (insert)</text>
    <text x="10" y="35" font-size="9" fill="#475569">Add new element at the end</text>
    <text x="10" y="50" font-size="9" fill="#475569">Bubble it up while parent > child</text>
    <text x="10" y="65" font-size="9" fill="#64748b">Time: O(log n)</text>
    <text x="10" y="78" font-size="9" fill="#64748b">Space: O(1)</text>
  </g>

  <!-- Pop -->
  <g transform="translate(290, 325)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Pop (extract min)</text>
    <text x="10" y="35" font-size="9" fill="#475569">Swap root with last element</text>
    <text x="10" y="50" font-size="9" fill="#475569">Bubble it down while parent > child</text>
    <text x="10" y="65" font-size="9" fill="#64748b">Time: O(log n)</text>
    <text x="10" y="78" font-size="9" fill="#64748b">Space: O(1)</text>
  </g>

  <!-- Heapify -->
  <g transform="translate(540, 325)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Heapify (build)</text>
    <text x="10" y="35" font-size="9" fill="#475569">Sift-down each non-leaf node</text>
    <text x="10" y="50" font-size="9" fill="#475569">Start from last parent upward</text>
    <text x="10" y="65" font-size="9" fill="#64748b">Time: O(n) — amortized</text>
    <text x="10" y="78" font-size="9" fill="#64748b">Space: O(1)</text>
  </g>
</svg>