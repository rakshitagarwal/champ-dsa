<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/></marker>
    <linearGradient id="arrG"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="stackG"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="popG"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="ansG"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="#fafafa" rx="12"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Monotonic Stack — Next Greater Element</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#64748b">Stack maintains increasing/decreasing order; popping reveals next greater/smaller element</text>

  <!-- Problem: NGE -->
  <rect x="20" y="65" width="370" height="160" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Problem: Next Greater Element (NGE)</text>
  <text x="205" y="100" text-anchor="middle" font-size="10" fill="#64748b">For each element, find the next larger element to the right</text>

  <g transform="translate(40, 112)">
    <rect x="0" y="0" width="56" height="34" rx="5" fill="url(#arrG)"/><text x="28" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="64" y="0" width="56" height="34" rx="5" fill="url(#arrG)"/><text x="92" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="128" y="0" width="56" height="34" rx="5" fill="url(#arrG)"/><text x="156" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <rect x="192" y="0" width="56" height="34" rx="5" fill="url(#arrG)"/><text x="220" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="256" y="0" width="56" height="34" rx="5" fill="url(#arrG)"/><text x="284" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>

    <!-- Result labels -->
    <text x="28" y="50" text-anchor="middle" font-size="9" fill="#64748b">NGE: 5</text>
    <text x="92" y="50" text-anchor="middle" font-size="9" fill="#64748b">NGE: 5</text>
    <text x="156" y="50" text-anchor="middle" font-size="9" fill="#64748b">NGE: —</text>
    <text x="220" y="50" text-anchor="middle" font-size="9" fill="#64748b">NGE: 3</text>
    <text x="284" y="50" text-anchor="middle" font-size="9" fill="#64748b">NGE: —</text>
  </g>

  <!-- Stack simulation -->
  <rect x="410" y="65" width="370" height="160" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">Algorithm Walkthrough (monotonic decreasing stack)</text>

  <g transform="translate(420, 100)">
    <!-- Stack states -->
    <text x="0" y="12" font-size="9" font-weight="600" fill="#475569">Scan left → right:</text>

    <text x="5" y="30" font-size="9" fill="#64748b">i=0 (4): stack empty → push 0</text>
    <rect x="155" y="18" width="55" height="20" rx="4" fill="rgba(6,182,212,0.15)"/>
    <text x="182" y="33" text-anchor="middle" font-size="9" fill="#0891b2">[0]</text>

    <text x="5" y="52" font-size="9" fill="#64748b">i=1 (2): 4 &gt; 2, stack inc → push 1</text>
    <rect x="205" y="40" width="75" height="20" rx="4" fill="rgba(6,182,212,0.15)"/>
    <text x="242" y="55" text-anchor="middle" font-size="9" fill="#0891b2">[0, 1]</text>

    <text x="5" y="74" font-size="9" font-weight="600" fill="#ef4444">i=2 (5): pop while stack top &lt; 5</text>
    <text x="15" y="90" font-size="9" fill="#475569">pop 1 (val=2): NGE[1] = 5</text>
    <text x="15" y="106" font-size="9" fill="#475569">pop 0 (val=4): NGE[0] = 5</text>
    <text x="15" y="122" font-size="9" fill="#475569">push 2 → stack: [2]</text>
    <rect x="155" y="112" width="55" height="20" rx="4" fill="rgba(6,182,212,0.15)"/>
    <text x="182" y="127" text-anchor="middle" font-size="9" fill="#0891b2">[2]</text>
  </g>

  <!-- Summary -->
  <g transform="translate(20, 240)">
    <rect x="0" y="0" width="760" height="165" rx="10" fill="rgba(99,102,241,0.04)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="380" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Monotonic Stack Patterns</text>

    <g transform="translate(20, 32)">
      <rect x="0" y="0" width="230" height="120" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Next Greater Element</text>
      <text x="10" y="36" font-size="9" fill="#64748b">Monotonic decreasing stack</text>
      <text x="10" y="52" font-size="9" fill="#64748b">Scan left→right</text>
      <text x="10" y="68" font-size="9" fill="#64748b">Pop while stack top &lt; curr</text>
      <text x="10" y="84" font-size="9" fill="#64748b">Popped element's NGE = curr</text>
      <text x="10" y="100" font-size="9" fill="#64748b">Push curr index</text>
    </g>

    <g transform="translate(265, 32)">
      <rect x="0" y="0" width="230" height="120" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">Next Smaller Element</text>
      <text x="10" y="36" font-size="9" fill="#64748b">Monotonic increasing stack</text>
      <text x="10" y="52" font-size="9" fill="#64748b">Scan left→right</text>
      <text x="10" y="68" font-size="9" fill="#64748b">Pop while stack top &gt; curr</text>
      <text x="10" y="84" font-size="9" fill="#64748b">Popped element's NSE = curr</text>
      <text x="10" y="100" font-size="9" fill="#64748b">Push curr index</text>
    </g>

    <g transform="translate(510, 32)">
      <rect x="0" y="0" width="230" height="120" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="115" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Classic Problems</text>
      <text x="10" y="36" font-size="9" fill="#64748b">• Daily Temperatures</text>
      <text x="10" y="52" font-size="9" fill="#64748b">• Largest Rectangle in Histogram</text>
      <text x="10" y="68" font-size="9" fill="#64748b">• Trapping Rain Water</text>
      <text x="10" y="84" font-size="9" fill="#64748b">• Stock Span Problem</text>
      <text x="10" y="100" font-size="9" fill="#64748b">• Remove K Digits</text>
    </g>
  </g>
</svg>